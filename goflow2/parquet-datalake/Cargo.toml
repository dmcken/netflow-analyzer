[package]
name = "parquet-datalake"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "pq-consumer"
path = "src/main.rs"

[dependencies]
arrow = { version = "53", features = ["prettyprint"] }
clap = { version = "4.6", features = ["derive"] }
parquet = "53"
signal-hook = "0.3"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt"] }

[profile.release]
opt-level = 3
lto = true
