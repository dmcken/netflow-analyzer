services:
  goflow2:
    image: goflow2-fixed:v2
    user: root # because docker-compose mount as root
    ports:
      - '8080:8080'
      - '2055:2055/udp'
    command:
      - -mapping=/field-map.yaml
      - -transport=file
      - -transport.file=/var/log/goflow/goflow2.fifo
      - -format=bin
      - -listen
      - "sflow://:6343/?workers=2,netflow://:2055/?count=4&workers=16"
    restart: unless-stopped
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "5"
    volumes:
      - /mnt/netflow/airlink-logs/fifo:/var/log/goflow
      - ./field-map.yaml:/field-map.yaml
